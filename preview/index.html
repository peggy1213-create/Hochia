  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  body{font:15px/1.5 system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}

<body>
<title>Hochia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a single centred phone column (max 430px). Sticky wordmark header,
     scrolling content, in-column bottom tab bar. Palette B "菜市場 Market", light-only by brand. */
  :root{
    --ground:#F3F6EE; --surface:#FFFFFF; --tint:#E3EBDA; --border:#D3DDC8;
    --ink:#1C2A21; --muted:#56655A; --primary:#2F6B3F; --primary-hover:#214D2D;
    --secondary:#E07A2E; --accent:#F2D16B;
    --backdrop:#DDE6D2; --shadow:0 1px 2px rgba(28,42,33,.06),0 6px 16px rgba(28,42,33,.07);
    color-scheme:light;
    --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-lg:17px; --fs-xl:21px; --fs-2xl:27px;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);background:var(--backdrop);color:var(--ink);
    font-size:var(--fs-base);line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  .app{
    width:100%;max-width:430px;min-height:100%;background:var(--ground);
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 0 0 1px var(--border);overflow:hidden;
  }
  /* ---- header ---- */
  header{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--primary);
    color:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:12px max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  .wordmark{font-weight:900;font-size:var(--fs-xl);letter-spacing:.5px}
  .wordmark small{font-weight:500;opacity:.8;font-size:var(--fs-xs);letter-spacing:1px;margin-left:6px}
  .lang{
    display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px;gap:2px;
  }
  .lang button{
    border:0;background:transparent;color:#fff;font-size:var(--fs-xs);font-weight:700;
    padding:7px 11px;border-radius:999px;min-height:34px;opacity:.75;
  }
  .lang button[aria-pressed="true"]{background:#fff;color:var(--primary);opacity:1}
  /* ---- content ---- */
  main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .wrap{padding:16px max(16px,env(safe-area-inset-left,0px)) 24px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
  .sample-flag{
    display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--ink);
    font-size:var(--fs-xs);font-weight:600;padding:8px 12px;border-radius:10px;line-height:1.35;
  }
  .eyebrow{font-size:var(--fs-xs);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
  .loc{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 10px 8px 12px;min-height:42px;font-weight:700;color:var(--ink);box-shadow:var(--shadow)}
  .loc .pin{color:var(--primary);display:flex}
  .loc .chev{color:var(--muted);display:flex}
  h2.sec{font-size:var(--fs-lg);font-weight:800;margin:4px 0 0;text-wrap:balance}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
  .card.pad{padding:16px}
  .muted{color:var(--muted)}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  /* date switcher */
  .days{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{
    flex:0 0 auto;min-width:48px;min-height:58px;border:1px solid var(--border);background:var(--surface);
    border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:var(--fs-xs);color:var(--muted);
  }
  .day b{font-size:var(--fs-lg);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .day[aria-pressed="true"]{background:var(--primary);border-color:var(--primary)}
  .day[aria-pressed="true"],.day[aria-pressed="true"] b{color:#fff}
  /* pick card */
  .pick{position:relative;overflow:hidden}
  .pick .pbar{height:6px;background:linear-gradient(90deg,var(--primary),var(--secondary))}
  .pick-body{padding:16px;display:flex;flex-direction:column;gap:12px}
  .dishgrid{display:flex;flex-direction:column;gap:9px}
  .dishline{display:flex;align-items:baseline;gap:9px}
  .dishline .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--secondary);transform:translateY(-1px)}
  .dishline .nm{font-weight:700}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:var(--fs-xs);font-weight:600;padding:5px 10px;border-radius:999px;background:var(--tint);color:var(--ink)}
  .tag.veg{background:#E6F0E0}.tag.pro{background:#F6E6D6}.tag.grain{background:#F6EFCF}
  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:var(--fs-base)}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.ghost{background:var(--surface);border-color:var(--border);color:var(--ink)}
  .btn.block{width:100%}
  .btn.sm{min-height:40px;padding:0 13px;font-size:var(--fs-sm)}
  /* list items */
  .list{display:flex;flex-direction:column;gap:0}
  .li{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
  .li:last-child{border-bottom:0}
  .li .ic{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--primary)}
  .li .tx{flex:1;min-width:0}
  .li .tx b{display:block;font-weight:700}
  .li .tx span{color:var(--muted);font-size:var(--fs-sm)}
  .chev{color:var(--muted);flex:0 0 auto}
  .badge{font-size:11px;font-weight:800;letter-spacing:.3px;padding:3px 8px;border-radius:6px;background:var(--secondary);color:var(--ink)}
  .badge.corn{background:var(--accent)}
  /* filter chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:var(--fs-sm);color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
  /* hero ingredient */
  .hero{padding:18px;background:linear-gradient(135deg,#2F6B3F,#3C864F);color:#fff;border-radius:16px}
  .hero .k{font-size:var(--fs-2xl);font-weight:900;line-height:1.1}
  .hero .s{opacity:.9;margin-top:4px}
  .hero .hbadge{display:inline-block;margin-top:12px;background:var(--accent);color:var(--ink);font-weight:800;font-size:var(--fs-xs);padding:5px 10px;border-radius:999px}
  /* stepper + checklist (在家煮) */
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .stepper button{width:46px;height:46px;border:0;background:var(--surface);font-size:21px;font-weight:700;color:var(--primary)}
  .stepper button:disabled{color:var(--border)}
  .stepper .val{min-width:52px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
  .check{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
  .check:last-child{border-bottom:0}
  .box{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff}
  .check[aria-pressed="true"] .box{background:var(--primary);border-color:var(--primary)}
  .check[aria-pressed="true"] .amt,.check[aria-pressed="true"] .nm{color:var(--muted)}
  .check .nm{flex:1;font-weight:600}.check .amt{color:var(--muted);font-variant-numeric:tabular-nums}
  .steps{counter-reset:s;display:flex;flex-direction:column;gap:14px;padding:0;margin:0;list-style:none}
  .steps li{display:flex;gap:12px}
  .steps li::before{counter-increment:s;content:counter(s);flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm)}
  .notice{font-size:var(--fs-sm);background:var(--tint);border-radius:10px;padding:10px 12px;color:var(--ink);display:flex;gap:8px}
  .ai-note{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);font-weight:700;color:var(--secondary)}
  /* empty states */
  .empty{text-align:center;color:var(--muted);padding:34px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .empty svg{color:var(--border)}
  /* Me rows */
  .merow{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
  .merow:last-child{border-bottom:0}
  .merow .ic{color:var(--primary)}
  .seg{display:flex;gap:6px;background:var(--tint);padding:4px;border-radius:12px}
  .seg button{flex:1;min-height:38px;border:0;background:transparent;border-radius:9px;font-weight:700;font-size:var(--fs-sm);color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  /* detail header */
  .detail-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .back{display:inline-flex;align-items:center;gap:4px;min-height:40px;border:0;background:none;color:var(--primary);font-weight:700;padding:0 4px 0 0;margin-left:-4px}
  /* bottom tabs */
  nav{
    position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);
    display:flex;padding:6px max(4px,env(safe-area-inset-left,0px));
    padding-right:max(4px,env(safe-area-inset-right,0px));
    padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  }
  .tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;min-height:52px;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
  .tab[aria-pressed="true"]{color:var(--primary)}
  .tab svg{width:24px;height:24px}
  /* first-run overlay */
  .overlay{position:absolute;inset:0;z-index:40;background:rgba(28,42,33,.5);display:flex;align-items:flex-end}
  .sheet{background:var(--ground);width:100%;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:92%;overflow-y:auto}
  .sheet h3{margin:0;font-size:var(--fs-2xl);font-weight:900;text-wrap:balance}
  .sheet .lead{color:var(--muted);margin:-8px 0 0}
  .optgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{min-height:52px;border:1px solid var(--border);background:var(--surface);border-radius:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
  .opt[aria-pressed="true"]{border-color:var(--primary);background:#E6F0E0;color:var(--primary-hover)}
  .dots{display:flex;gap:6px;justify-content:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--border)}
  .dots i.on{background:var(--primary);width:18px;border-radius:999px}
  .skip{align-self:center;background:none;border:0;color:var(--muted);font-weight:600;min-height:40px;font-size:var(--fs-sm)}
  .toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:var(--fs-sm);z-index:30;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--secondary);outline-offset:2px;border-radius:8px}
</style>

<div class="app" id="app">
  <header>
    <div class="wordmark">Hochia <small id="tagline"></small></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="zh-TW" aria-pressed="true">中文</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <main id="main"><div class="wrap" id="view"></div></main>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay" hidden></div>
</div>

/* ---------------- state ---------------- */
const state={
  lang:(navigator.language||'').startsWith('zh')?'zh-TW':'zh-TW',
  tab:'today', day:4 /* Fri index */, detail:null,
  servings:4, seasonFilter:'local', seasonGroup:'all', weekGroup:'all',
  shopping:new Set(), favorites:new Set(), cooked:[],
  region:null, diet:new Set(), setupStep:0, setupDone:false,
};
// default region (canonical zh for filtering + display strings per language)
state.region={cZh:'臺北市',cEn:'Taipei',dZh:'松山區',dEn:"Songshan"};

/* ---------------- helpers ---------------- */
const el=(id)=>document.getElementById(id);
function toast(msg){const t=el('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600);}
function groupTag(g){const t=T[state.lang].foodGroups;return `<span class="tag ${g}">${t[g]}</span>`;}
function amtFor(ing){const a=ing.amt;const n=Math.round(a.base*state.servings/4*10)/10;const unit=(state.lang==='en'&&a.unitEn)?a.unitEn:a.unit;return `${n} ${unit}`;}

/* ---------------- persistence (per-device, best-effort) ---------------- */
const LSKEY='hochia.prefs.v1';
function save(){try{localStorage.setItem(LSKEY,JSON.stringify({lang:state.lang,region:state.region,servings:state.servings,diet:[...state.diet],shopping:[...state.shopping],favorites:[...state.favorites],cooked:state.cooked,setupDone:state.setupDone}));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(LSKEY)||'null');if(!s)return false;if(s.lang)state.lang=s.lang;if(s.region)state.region=s.region;if(typeof s.servings==='number')state.servings=s.servings;if(Array.isArray(s.diet))state.diet=new Set(s.diet);if(Array.isArray(s.shopping))state.shopping=new Set(s.shopping);if(Array.isArray(s.favorites))state.favorites=new Set(s.favorites);if(Array.isArray(s.cooked))state.cooked=s.cooked;state.setupDone=!!s.setupDone;return state.setupDone;}catch(e){return false;}}

/* ---------------- renderers ---------------- */
function render(){
  const t=T[state.lang];
  el('tagline').textContent=t.tagline;
  // lang buttons
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===state.lang)));
  // nav
  el('nav').innerHTML=Object.keys(t.tabs).map(k=>
    `<button class="tab" data-tab="${k}" aria-pressed="${state.tab===k}">${IC[k]}<span>${t.tabs[k]}</span></button>`).join('');
  // view
  const v=el('view');
  if(state.detail){v.innerHTML=renderDetail();}
  else v.innerHTML={today:renderToday,season:renderSeason,week:renderWeek,me:renderMe}[state.tab]();
  el('main').scrollTop=0;
  save();
}
function sampleFlag(){return `<div class="sample-flag">${IC.info}<span>${T[state.lang].sample}</span></div>`;}

function renderToday(){
  const t=T[state.lang];const weekend=DAYS[state.day].wd===0||DAYS[state.day].wd===6;
  const days=DAYS.map((d,i)=>`<button class="day" data-day="${i}" aria-pressed="${i===state.day}"><span>${L(d)}</span><b>${d.d}</b></button>`).join('');
  const locBtn=`<button class="loc" data-pickregion><span class="pin">${IC.pin}</span>${regionLabel()}<span class="chev">${IC.chev}</span></button>`;
  const seasonShortcut=`<button class="card pad row between" style="width:100%;text-align:left;border:1px solid var(--border)" data-go="season"><span class="row">${IC.leaf}<b>${t.toSeason.replace(' →','')}</b></span>${IC.chev}</button>`;
  const city=cm();
  if(!city){  // preview only has samples for a few cities
    return `${sampleFlag()}
    ${locBtn}
    <div class="days">${days}</div>
    <div class="card pad"><div class="empty">${IC.school}<span>${t.schoolsCityOnly}</span><button class="btn ghost sm" data-settaipei>${t.switchTaipei}</button></div></div>
    ${seasonShortcut}`;
  }
  let pick;
  if(weekend){
    pick=`<div class="card pad"><div class="row between"><div class="eyebrow">${t.weekend}</div></div>
      <p class="muted" style="margin:8px 0 14px">${t.weekendBody}</p>
      <button class="btn primary block" data-go="season">${t.toSeason}</button></div>`;
  }else{
    const lines=city.pick.map(id=>{const d=city.dishes[id];if(!d)return '';return `<div class="dishline"><span class="dot"></span><span class="nm">${L(d.nm)}</span><span class="tag">${L(d.cat)}</span></div>`;}).join('');
    pick=`<div class="card pick">
      <div class="pbar"></div>
      <div class="pick-body">
        <div class="eyebrow">${t.todayPickTitle} · ${t.pickWhy}</div>
        <div class="dishgrid">${lines}</div>
      </div></div>`;
  }
  const schools=city.schools.map((s,i)=>`<button class="li" data-school="${i}">
      <span class="ic">${IC.school}</span>
      <span class="tx"><b>${L(s.nm)}</b><span>${L(s.dist)}</span></span>${IC.chev}</button>`).join('');
  return `${sampleFlag()}
    ${locBtn}
    <div class="days">${days}</div>
    ${pick}
    ${weekend?'':seasonShortcut}
    <h2 class="sec">${t.nearby}</h2>
    <div class="card pad"><div class="list">${schools}</div></div>`;
}

function renderSeason(){
  const t=T[state.lang];
  const cDisp=state.lang==='en'?state.region.cEn:state.region.cZh;
  let items=CROPS.map((c,i)=>({c,i}));
  if(state.seasonGroup!=='all') items=items.filter(x=>x.c.type===state.seasonGroup);
  let widened=false;
  if(state.seasonFilter==='local'){
    const loc=items.filter(x=>x.c.cty && x.c.cty.includes(state.region.cZh));
    if(loc.length) items=loc; else widened=true; // sparse: no local produce -> show all Taiwan + notice
  }
  items.sort((a,b)=>(b.c.inWeek?1:0)-(a.c.inWeek?1:0)); // schools-this-week first; keep each crop's real index
  const rows=items.length?items.map(({c,i})=>`<button class="li" data-crop="${i}">
        <span class="ic">${IC.leaf}</span>
        <span class="tx"><b>${L(c.nm)} ${c.alias?`<span class="muted" style="font-weight:500">${L(c.alias)}</span>`:''}</b>
          <span>${c.inWeek?`<span class="badge">${t.usedBySchools}</span> · `:''}${t.peakMonths} ${c.peak}</span></span>${IC.chev}</button>`).join('')
    :`<div class="empty">${IC.leaf}<span>${state.lang==='en'?'Nothing in this group this month.':'本月此類別沒有盛產。'}</span></div>`;
  const gchips=['all','fruit','veg','grain'].map(g=>`<button class="chip" data-sgroup="${g}" aria-pressed="${state.seasonGroup===g}">${t.cropTypes[g]}</button>`).join('');
  const widenNote=widened?`<div class="notice">${IC.info}<span>${t.seasonLocalEmpty(cDisp)}</span></div>`:'';
  return `${sampleFlag()}
    <h2 class="sec">${t.seasonTitle}</h2>
    <p class="muted" style="margin:0">${t.seasonLead}</p>
    <div class="chips">
      <button class="chip" data-season="local" aria-pressed="${state.seasonFilter==='local'}">${t.local}（${cDisp}）</button>
      <button class="chip" data-season="all" aria-pressed="${state.seasonFilter==='all'}">${t.all}</button>
    </div>
    <div class="chips">${gchips}</div>
    ${widenNote}
    <div class="card pad"><div class="list">${rows}</div></div>`;
}

function renderWeek(){
  const t=T[state.lang];const hero=WEEK_ING[0];
  const groups=['all','veg','pro','grain'];
  const chips=groups.map(g=>`<button class="chip" data-week="${g}" aria-pressed="${state.weekGroup===g}">${g==='all'?(state.lang==='en'?'All':'全部'):t.foodGroups[g]}</button>`).join('');
  const rows=WEEK_ING.filter(w=>state.weekGroup==='all'||w.grp===state.weekGroup).map(w=>`
    <div class="li" style="cursor:default">
      <span class="ic">${IC.bag}</span>
      <span class="tx"><b>${L(w.nm)} ${w.peak?`<span class="badge corn">${state.lang==='en'?'In season':'盛產'}</span>`:''}</b>
        <span>${t.atSchools(w.schools)} · ${t.foodGroups[w.grp]}</span></span>
    </div>`).join('');
  return `${sampleFlag()}
    <div class="hero">
      <div class="eyebrow" style="color:rgba(255,255,255,.85)">${t.weekHeroEyebrow}</div>
      <div class="k">${L(hero.nm)}</div>
      <div class="s">${t.atSchools(hero.schools)}</div>

    <p class="muted" style="margin:0;font-size:var(--fs-sm)">${t.weekNote}</p>
    <div class="chips">${chips}</div>
    <div class="card pad"><div class="list">${rows}</div></div>`;
}

function renderMe(){
  const t=T[state.lang];
  const diet=[...state.diet].map(d=>T[state.lang].diets[d]).join(state.lang==='en'?', ':'、')||t.dietNone;
  return `${sampleFlag()}
    <h2 class="sec">${t.meSettings}</h2>
    <div class="card pad"><div class="list">
      <div class="merow"><span class="ic">${IC.settings}</span><span class="tx"><b>${t.settingServings}</b><span>${state.servings}</span></span></div>
      <div class="merow"><span class="ic">${IC.settings}</span><span class="tx"><b>${t.settingDiet}</b><span>${diet}</span></span></div>
    </div></div>

      <div><div class="eyebrow">${t.aboutSources}</div>

function renderDetail(){
  const t=T[state.lang];const d=state.detail;
  const back=`<div class="detail-top"><button class="back">${IC.back}${t.tabs[state.tab]}</button></div>`;
  if(d.type==='school'){
    const city=cm(); const s=city.schools[d.id];
    const dishes=s.menu.map(id=>{const dd=city.dishes[id];if(!dd)return '';
      const ings=dd.ings.map(ig=>`${L(ig.nm)}${ig.cert?` <span class="muted">·${L(ig.cert)}</span>`:''}`).join('、');
      return `<div class="li" style="cursor:default;align-items:flex-start">
        <span class="ic">${IC.pot}</span>
        <span class="tx"><b>${L(dd.nm)} <span class="badge corn" style="font-size:10px">${L(dd.cat)}</span></b><span>${ings||'—'}</span></span></div>`;}).join('');
    return `${back}<h2 class="sec">${L(s.nm)}</h2><p class="muted" style="margin:0">${L(s.dist)} · ${city.date} · ${t.schoolMenu}</p>
      <div class="card pad"><div class="list">${dishes}</div></div>`;
  }
  if(d.type==='crop'){
    const c=CROPS[d.id];
    return `${back}<h2 class="sec">${L(c.nm)} ${c.alias?`<span class="muted" style="font-weight:500;font-size:var(--fs-base)">${L(c.alias)}</span>`:''}</h2>
      ${c.inWeek?`<div><span class="badge">${t.usedBySchools}</span></div>`:''}
      <div class="card pad" style="display:flex;flex-direction:column;gap:12px">
        <div><div class="eyebrow">${t.peakMonths}</div><div style="margin-top:4px;font-weight:700">${c.peak} ${state.lang==='en'?'':'月'}</div></div>
        <div><div class="eyebrow">${t.mainCounties}</div><div style="margin-top:4px">${L(c.counties)}</div></div>
      </div>`;
  }
  return `${back}`; // cook-at-home (在家煮) removed
}

/* ---------------- first-run setup ---------------- */
function renderSetup(){
  state.overlayMode='setup';
  const t=T[state.lang];const ov=el('overlay');ov.hidden=false;
  const dots=`<div class="dots">${[0,1,2].map(i=>`<i class="${i===state.setupStep?'on':''}"></i>`).join('')}</div>`;
  let body='';
  if(state.setupStep===0){
    body=`<h3>${t.w1t}</h3><p class="lead">${t.w1b}</p>
      <div class="eyebrow">${t.w1lang}</div>
      <div class="optgrid"><button class="opt" data-setlang="zh-TW" aria-pressed="${state.lang==='zh-TW'}">中文</button>
        <button class="opt" data-setlang="en" aria-pressed="${state.lang==='en'}">English</button></div>
      <button class="btn primary block" data-setup="next">${t.next}</button>`;
  }else if(state.setupStep===1){
    const counties=t.counties.map((c,i)=>`<button class="opt" data-county="${i}" aria-pressed="${T['zh-TW'].counties[i]===state.region.cZh}">${c}</button>`).join('');
    body=`<h3>${t.w2t}</h3><p class="lead">${t.w2b}</p>
      <div class="optgrid">${counties}</div>
      <button class="btn primary block" data-setup="next">${t.next}</button>`;
  }else{
    const diets=Object.keys(t.diets).map(k=>`<button class="opt" data-diet="${k}" aria-pressed="${state.diet.has(k)}">${t.diets[k]}</button>`).join('');
    body=`<h3>${t.w3t}</h3><p class="lead">${t.w3b}</p>
      <div class="eyebrow">${t.settingServings}</div>
      <div class="stepper" style="align-self:flex-start"><button data-ssteps="-1" ${state.servings<=1?'disabled':''}>−</button><span class="val">${state.servings}</span><button data-ssteps="1" ${state.servings>=8?'disabled':''}>+</button></div>
      <div class="eyebrow">${t.settingDiet}</div>
      <div class="optgrid">${diets}</div>
      <button class="btn primary block" data-setup="done">${t.start}</button>`;
  }
  ov.innerHTML=`<div class="sheet">${dots}${body}<button class="skip" data-setup="skip">${t.skip}</button></div>`;
}
function closeSetup(){state.overlayMode=null;state.setupDone=true;el('overlay').hidden=true;el('overlay').innerHTML='';render();}
function regionLabel(){const r=state.region;const city=state.lang==='en'?r.cEn:r.cZh;const d=state.lang==='en'?r.dEn:r.dZh;return (d&&d!=='—')?`${city} · ${d}`:city;}
function renderRegionPicker(){
  state.overlayMode='region';
  const t=T[state.lang];const ov=el('overlay');ov.hidden=false;
  const counties=t.counties.map((c,i)=>`<button class="opt" data-pickcounty="${i}" aria-pressed="${T['zh-TW'].counties[i]===state.region.cZh}">${c}</button>`).join('');
  ov.innerHTML=`<div class="sheet"><h3>${t.pickRegionTitle}</h3><p class="lead">${t.pickRegionLead}</p><div class="optgrid">${counties}</div><button class="skip" data-pickclose>${t.done}</button></div>`;
}

/* ---------------- events ---------------- */
document.addEventListener('click',(e)=>{
  const tb=e.target.closest('.lang button'); if(tb){state.lang=tb.dataset.lang; if(!el('overlay').hidden){state.overlayMode==='region'?renderRegionPicker():renderSetup();} render(); return;}
  const pr=e.target.closest('[data-pickregion]'); if(pr){renderRegionPicker();return;}
  const tp=e.target.closest('[data-settaipei]'); if(tp){state.region={cZh:'臺北市',cEn:'Taipei',dZh:'松山區',dEn:"Songshan"};render();return;}
  const pc=e.target.closest('[data-pickcounty]'); if(pc){const i=+pc.dataset.pickcounty;const cZh=T['zh-TW'].counties[i],cEn=T['en'].counties[i];const dZh=(T['zh-TW'].districts[cZh]||['—'])[0],dEn=(T['en'].districts[cEn]||['—'])[0];state.region={cZh,cEn,dZh,dEn};closeSetup();return;}
  const px=e.target.closest('[data-pickclose]'); if(px){closeSetup();return;}
  const tab=e.target.closest('.tab'); if(tab){state.tab=tab.dataset.tab;state.detail=null;render();return;}
  const go=e.target.closest('[data-go]'); if(go){state.tab=go.dataset.go;state.detail=null;render();return;}
  const sc=e.target.closest('[data-school]'); if(sc){state.detail={type:'school',id:+sc.dataset.school};render();return;}
  const cr=e.target.closest('[data-crop]'); if(cr){state.detail={type:'crop',id:+cr.dataset.crop};render();return;}
  const bk=e.target.closest('.back'); if(bk){state.detail=null;render();return;}
  const sf=e.target.closest('[data-season]'); if(sf){state.seasonFilter=sf.dataset.season;render();return;}
  const sg=e.target.closest('[data-sgroup]'); if(sg){state.seasonGroup=sg.dataset.sgroup;render();return;}
  const wk=e.target.closest('[data-week]'); if(wk){state.weekGroup=wk.dataset.week;render();return;}
  // setup
  const sl=e.target.closest('[data-setlang]'); if(sl){state.lang=sl.dataset.setlang;renderSetup();render();return;}
  const cty=e.target.closest('[data-county]'); if(cty){const i=+cty.dataset.county;const cZh=T['zh-TW'].counties[i],cEn=T['en'].counties[i];const dZh=(T['zh-TW'].districts[cZh]||['—'])[0],dEn=(T['en'].districts[cEn]||['—'])[0];state.region={cZh,cEn,dZh,dEn};renderSetup();return;}
  const dt=e.target.closest('[data-diet]'); if(dt){const k=dt.dataset.diet;if(state.diet.has(k))state.diet.delete(k);else state.diet.add(k);renderSetup();return;}
  const ss=e.target.closest('[data-ssteps]'); if(ss){state.servings=Math.min(8,Math.max(1,state.servings+ +ss.dataset.ssteps));renderSetup();return;}
  const su=e.target.closest('[data-setup]'); if(su){const a=su.dataset.setup;
     if(a==='next'){state.setupStep++;renderSetup();}
     else{closeSetup();} return;}
});

/* ---------------- boot ---------------- */
const resumed=load();      // restore saved prefs; skip first-run setup if already completed
if(!resumed) renderSetup();
render();
</script>
